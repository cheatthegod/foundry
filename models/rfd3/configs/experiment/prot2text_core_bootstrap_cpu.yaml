# @package _global_

defaults:
  - override /datasets: prot2text_core_64_1024
  - override /paths: local_smoke
  - override /logger: csv
  - _self_

name: rfd3-prot2text-core-bootstrap-cpu
project: rfd3-prot2text
tags:
  - prot2text
  - monomer
  - bootstrap
  - noligand
  - cpu
ckpt_path: null

trainer:
  accelerator: cpu
  devices_per_node: 1
  num_nodes: 1
  precision: 32-true
  grad_accum_steps: 4
  checkpoint_every_n_epochs: 1
  validate_every_n_epochs: 1000
  prevalidate: False

dataloader:
  train:
    dataloader_params:
      num_workers: 0
      pin_memory: False
      prefetch_factor: null
    n_fallback_retries: 8
  val:
    dataloader_params:
      num_workers: 0
      pin_memory: False
      prefetch_factor: null
    n_fallback_retries: 0

datasets:
  val: null
