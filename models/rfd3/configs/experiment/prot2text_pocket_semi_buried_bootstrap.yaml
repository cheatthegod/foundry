# @package _global_

defaults:
  - override /datasets: prot2text_pocket_semi_buried
  - override /paths: local_smoke
  - override /logger: csv
  - _self_

# Enzymes with buried_fraction in [0.2, 0.35)

name: rfd3-prot2text_pocket_semi_buried
project: rfd3-prot2text
tags:
  - prot2text
  - enzyme
  - pocket
  - enriched
ckpt_path: null

trainer:
  devices_per_node: 1
  num_nodes: 1
  precision: bf16-mixed
  grad_accum_steps: 4
  checkpoint_every_n_epochs: 1
  validate_every_n_epochs: 1000
  prevalidate: False

dataloader:
  train:
    dataloader_params:
      num_workers: 2
      pin_memory: True
      prefetch_factor: 2
    n_fallback_retries: 8
  val:
    dataloader_params:
      num_workers: 1
      pin_memory: True
      prefetch_factor: 2
    n_fallback_retries: 0

datasets:
  val: null
