# @package _global_

defaults:
  - override /datasets: prot2text_conditioned_enzyme
  - override /paths: local_smoke
  - override /logger: csv
  - _self_

# Line B production: metadata-conditioned enriched enzyme training on GPU.
# 133K enzyme samples, RASA/SS/non-loopy conditioning driven by per-sample metadata.

name: rfd3-prot2text-conditioned-enzyme-gpu
project: rfd3-prot2text
tags:
  - prot2text
  - enzyme
  - conditioned
  - metadata
  - gpu
  - line_b
ckpt_path: null

trainer:
  devices_per_node: 1
  num_nodes: 1
  precision: bf16-mixed
  max_epochs: 5
  grad_accum_steps: 4
  checkpoint_every_n_epochs: 1
  validate_every_n_epochs: 1000
  prevalidate: False
  clip_grad_max_norm: 1.0

dataloader:
  train:
    dataloader_params:
      num_workers: 4
      pin_memory: True
      prefetch_factor: 2
    n_fallback_retries: 8
  val:
    dataloader_params:
      num_workers: 1
      pin_memory: True
      prefetch_factor: 2
    n_fallback_retries: 0

datasets:
  val: null
